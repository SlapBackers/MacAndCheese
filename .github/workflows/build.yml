# Builds and tests the VST3 on macOS, Windows and Linux.
# Every push: zips are downloadable from the run's page (Artifacts).
# A version tag (v*): the zips are attached to a draft release of that tag.
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14,     name: macOS,   cmake: '-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64' }
          - { os: windows-2022, name: Windows, cmake: '' }
          - { os: ubuntu-22.04, name: Linux,   cmake: '' }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      ZIP: Mac-and-Cheese-VST3-plugin-${{ matrix.name }}.zip
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev \
            libxext-dev libfreetype-dev libfontconfig1-dev libgl1-mesa-dev xvfb fonts-dejavu-core

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release ${{ matrix.cmake }}

      - name: Build
        run: cmake --build build --config Release --parallel 4 --target MacAndCheese_VST3 MacAndCheeseCLI MacAndCheeseFlowTest

      - name: Test
        run: |
          A=build/MacAndCheeseCLI_artefacts/Release
          F=build/MacAndCheeseFlowTest_artefacts/Release
          VST="build/MacAndCheese_artefacts/Release/VST3/Mac and Cheese.vst3"
          case "$RUNNER_OS" in
            macOS)   FLOW="$F/MacAndCheeseFlowTest.app/Contents/MacOS/MacAndCheeseFlowTest" ;;
            Windows) FLOW="$F/MacAndCheeseFlowTest.exe" ;;
            Linux)   FLOW="xvfb-run -a $F/MacAndCheeseFlowTest" ;;
          esac
          "$A/MacAndCheeseCLI" selftest
          $FLOW "$RUNNER_TEMP/renders"
          $FLOW --load-vst3 "$VST"

      - name: Package
        run: |
          cd "build/MacAndCheese_artefacts/Release/VST3"
          case "$RUNNER_OS" in
            macOS)   ditto -c -k --keepParent --norsrc --noextattr --noqtn "Mac and Cheese.vst3" "$GITHUB_WORKSPACE/$ZIP" ;;
            Windows) 7z a -tzip "$GITHUB_WORKSPACE/$ZIP" "Mac and Cheese.vst3" ;;
            Linux)   zip -r -X "$GITHUB_WORKSPACE/$ZIP" "Mac and Cheese.vst3" ;;
          esac

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP }}
          path: ${{ env.ZIP }}
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: renders-${{ matrix.name }}
          path: ${{ runner.temp }}/renders/*.png
          if-no-files-found: ignore

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: Mac-and-Cheese-*
          merge-multiple: true
      - name: Draft release with the three zips
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          awk -v v="## $TAG" 'index($0, v) == 1 {f=1; next} /^## /{if (f) exit} f' CHANGELOG.md > notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" Mac-and-Cheese-*.zip --clobber
          else
            gh release create "$TAG" Mac-and-Cheese-*.zip --draft --title "$TAG" --notes-file notes.md
          fi
